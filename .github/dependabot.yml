version: 2
updates:
  # uv.lock is the source (since 1.1). Dependabot updates the lock, not the
  # two exports: its pull request fails the export comparison in
  # tests/test_repo_hygiene.py until both `uv export` commands from
  # CONTRIBUTING.md have been run again on its branch.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # mcp is pinned on purpose (1.30.0): mcp 2.0.0 moves/removes
    # mcp.server.fastmcp. A bump is a deliberate task with its own green run,
    # not something a bot decides.
    ignore:
      - dependency-name: "mcp"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
