version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # mcp is pinned on purpose (1.30.0): mcp 2.0.0 moves/removes
    # mcp.server.fastmcp. A bump is a deliberate task with its own green run,
    # not something a bot decides.
    ignore:
      - dependency-name: "mcp"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
