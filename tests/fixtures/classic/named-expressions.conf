add audit nslogAction NSLOG_ACT 192.0.2.51 -logLevel ALL
add policy expression NE_AUDIT ns_true
add audit nslogPolicy NSLOG_POL NE_AUDIT NSLOG_ACT
bind system global NSLOG_POL -priority 110
add policy expression NE_LOS "REQ.HTTP.URL CONTAINS /los"
add policy expression NE_CS "REQ.HTTP.URL CONTAINS /oud"
add cs policy CSP_NE -rule NE_CS
bind cs vserver CS_VS -policyName CSP_NE -targetLBVserver LB_VS -priority 110
