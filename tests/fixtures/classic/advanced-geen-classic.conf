add cs vserver CS_VS HTTP 192.0.2.10 80
add cs policy CSP_NIEUW -rule "HTTP.REQ.URL.STARTSWITH(\"/nieuw\")"
bind cs vserver CS_VS -policyName CSP_NIEUW -targetLBVserver LB_VS -priority 100
add cr policy CRP_NIEUW -rule "HTTP.REQ.URL.CONTAINS(\"ns_cache\")" -action ORIGIN
bind cr vserver CR_VS -policyName CRP_NIEUW -priority 100
add responder policy RSP_NIEUW true RSP_ACT
add cache policy CACHE_NIEUW -rule "!HTTP.REQ.METHOD.eq(GET)" -action NOCACHE
add authentication Policy AUTH_NIEUW -rule true -action LDAP_ACT
add audit syslogPolicy SYS_NIEUW true SYS_ACT
add policy expression NE_NIEUW "HTTP.REQ.HEADER(\"Host\").EXISTS"
